<!DOCTYPE html>
<html>
<head>
    <title>Hybrid IDS Dashboard</title>
    <style>
        body {
            font-family: 'Consolas', monospace;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #58a6ff;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
        }
        .status {
            color: #3fb950;
            margin-bottom: 20px;
        }
        .alert {
            background: #161b22;
            border-left: 4px solid #f85149;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        .alert.ml {
            border-left-color: #d29922;
        }
        .alert-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .alert-type {
            color: #f85149;
        }
        .alert.ml .alert-type {
            color: #d29922;
        }
        .alert-time {
            color: #8b949e;
        }
        .alert-message {
            margin-top: 6px;
            color: #c9d1d9;
        }
        .empty {
            color: #8b949e;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <h1>🛡️ Hybrid IDS Dashboard</h1>
    <div class="status">● Monitoring live traffic...</div>
    <div id="alerts-container">
        <div class="empty">No alerts yet. Waiting for suspicious activity...</div>
    </div>

    <script>
        async function fetchAlerts() {
            const res = await fetch('/api/alerts');
            const alerts = await res.json();

            const container = document.getElementById('alerts-container');
            if (alerts.length === 0) {
                container.innerHTML = '<div class="empty">No alerts yet. Waiting for suspicious activity...</div>';
                return;
            }

            container.innerHTML = alerts.map(a => `
                <div class="alert ${a.type === 'ML' ? 'ml' : ''}">
                    <div class="alert-header">
                        <span class="alert-type">${a.type === 'ML' ? '🤖 ML DETECTION' : '⚡ SIGNATURE MATCH'}</span>
                        <span class="alert-time">${a.time}</span>
                    </div>
                    <div class="alert-message">Source: ${a.src_ip} — ${a.message}</div>
                </div>
            `).join('');
        }

        fetchAlerts();
        setInterval(fetchAlerts, 2000);  // refresh every 2 seconds
    </script>
</body>
</html>
